<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061a38">
  <meta name="description" content="Install GraxCare Ready — The 60-Second Family Care Action System.">
  <title>Install GraxCare Ready</title>
  <link rel="manifest" href="./manifest-commercial.webmanifest?r=commercial-master-20260807n">
  <link rel="icon" href="./assets/graxcare-app-icon.svg?brand=locked-master-20260807n" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6fa;color:#0d1b3d}
    body{display:grid;place-items:center;padding:22px}.card{width:min(420px,100%);background:#fff;border:1px solid #d8e0ea;border-radius:26px;padding:28px 22px;box-shadow:0 18px 55px rgba(6,26,56,.15);text-align:center}
    .icon-shell{width:124px;height:124px;margin:0 auto 18px;display:grid;place-items:center;border-radius:28px;background:#fff;border:1px solid #dce4ed;box-shadow:0 12px 28px rgba(13,27,61,.14);overflow:hidden}
    .icon-shell img{width:112px;height:112px;object-fit:contain;display:block}
    .eyebrow{margin:0 0 7px;color:#087c76;font-size:12px;font-weight:850;letter-spacing:.07em;text-transform:uppercase}h1{margin:0;font-size:28px;letter-spacing:-.03em}p{color:#53647c;line-height:1.45}.tagline{margin:9px auto 22px;max-width:320px}
    .button{width:100%;min-height:52px;border:0;border-radius:14px;padding:13px 16px;background:#087c76;color:#fff;font-weight:850;font-size:16px;cursor:pointer}.button:disabled{opacity:.65;cursor:wait}.secondary{display:inline-block;margin-top:14px;color:#153f72;font-weight:750;text-decoration:none}.status{min-height:42px;margin:16px 0 0;font-size:13px;color:#667085}.brand-proof{margin-top:20px;padding-top:17px;border-top:1px solid #eaecf0;color:#7a8798;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon-shell"><img src="./assets/graxcare-app-icon.svg?brand=locked-master-20260807n" alt="GraxCare Ready commercial icon"></div>
    <p class="eyebrow">Official commercial version</p>
    <h1>GraxCare Ready</h1>
    <p class="tagline">The 60-Second Family Care Action System</p>
    <button id="primaryButton" class="button" type="button">Preparing installation…</button>
    <a id="openLink" class="secondary" href="./?build=compact-commercial-20260807o" hidden>Open GraxCare Ready</a>
    <p id="status" class="status">Preparing the commercial app for this device.</p>
    <div class="brand-proof">Commercial identity · approved locked master logo</div>
  </main>
  <script>
    (()=>{
      const button=document.getElementById('primaryButton');
      const status=document.getElementById('status');
      const openLink=document.getElementById('openLink');
      let promptEvent=null;
      const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

      function showOpen(message){
        button.disabled=false;
        button.textContent='Open GraxCare Ready';
        button.dataset.mode='open';
        openLink.hidden=true;
        status.textContent=message;
      }

      if(standalone){showOpen('The commercial app is already installed on this device.');}

      window.addEventListener('beforeinstallprompt',event=>{
        event.preventDefault();
        promptEvent=event;
        button.disabled=false;
        button.dataset.mode='install';
        button.textContent='Install GraxCare Ready';
        status.textContent='Commercial icon verified. Tap once to install.';
      });

      window.addEventListener('appinstalled',()=>{
        promptEvent=null;
        showOpen('Installation completed with the commercial GraxCare Ready identity.');
      });

      button.addEventListener('click',async()=>{
        if(button.dataset.mode==='install'&&promptEvent){
          button.disabled=true;
          promptEvent.prompt();
          const choice=await promptEvent.userChoice;
          promptEvent=null;
          if(choice.outcome==='accepted'){
            status.textContent='Installation accepted. You can now open GraxCare Ready.';
            showOpen(status.textContent);
          }else{
            button.disabled=false;
            button.textContent='Install GraxCare Ready';
            button.dataset.mode='install';
            status.textContent='Installation was not completed.';
          }
          return;
        }
        location.href='./?build=compact-commercial-20260807o';
      });

      if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}

      setTimeout(()=>{
        if(!promptEvent&&!standalone){
          button.disabled=false;
          button.dataset.mode='open';
          button.textContent='Open GraxCare Ready';
          openLink.hidden=true;
          status.textContent='If Chrome does not offer installation automatically, open its menu and choose “Add to Home screen” or “Install app”.';
        }
      },2200);
    })();
  </script>
</body>
</html>
