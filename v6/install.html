<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061a38">
  <meta name="description" content="Install GraxCare Ready — The 60-Second Family Care Action System.">
  <title>Install GraxCare Ready</title>
  <link rel="manifest" href="./manifest-commercial.webmanifest?r=commercial-hq-20260807v">
  <link rel="icon" href="./assets/graxcare-icon-192.png?v=20260807v" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./assets/graxcare-icon-512.png?v=20260807v">
  <style>
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6fa;color:#0d1b3d}
    body{display:grid;place-items:center;padding:22px}
    .card{width:min(420px,100%);background:#fff;border:1px solid #dde4ec;border-radius:28px;padding:30px 24px 28px;box-shadow:0 22px 60px rgba(6,26,56,.14);text-align:center}
    .icon-shell{width:154px;height:154px;margin:0 auto 20px;display:grid;place-items:center;border-radius:32px;background:#fff;border:1px solid #e3e8ef;box-shadow:0 14px 32px rgba(13,27,61,.12);overflow:hidden}
    .icon-shell img{width:144px;height:144px;object-fit:contain;display:block;image-rendering:auto}
    h1{margin:0;font-size:29px;line-height:1.08;letter-spacing:-.035em}
    .tagline{margin:10px auto 23px;max-width:310px;color:#53647c;line-height:1.42;font-size:15px}
    .button{width:100%;min-height:54px;border:0;border-radius:15px;padding:14px 16px;background:#087c76;color:#fff;font-weight:850;font-size:16px;cursor:pointer;box-shadow:0 7px 18px rgba(8,124,118,.18)}
    .button:disabled{opacity:.62;cursor:wait}
    .status{margin:13px 0 0;font-size:12.5px;line-height:1.4;color:#6b7789}
    .status.error{color:#b42318;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon-shell"><img id="installIcon" src="./assets/graxcare-icon-512.png?v=20260807v" width="144" height="144" alt="GraxCare Ready"></div>
    <h1>GraxCare Ready</h1>
    <p class="tagline">The 60-Second Family Care Action System</p>
    <button id="primaryButton" class="button" type="button" disabled>Preparing…</button>
    <p id="status" class="status" hidden></p>
  </main>
  <script>
    (()=>{
      const button=document.getElementById('primaryButton');
      const status=document.getElementById('status');
      const icon=document.getElementById('installIcon');
      let promptEvent=null;
      let iconReady=false;
      const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

      function setStatus(message='',isError=false){
        status.textContent=message;
        status.classList.toggle('error',isError);
        status.hidden=!message;
      }

      function syncButton(){
        if(!iconReady){button.disabled=true;button.textContent='Preparing…';return;}
        if(standalone){button.disabled=false;button.dataset.mode='open';button.textContent='Open GraxCare Ready';return;}
        if(promptEvent){button.disabled=false;button.dataset.mode='install';button.textContent='Install GraxCare Ready';return;}
        button.disabled=false;button.dataset.mode='open';button.textContent='Open GraxCare Ready';
      }

      async function verifyIcon(){
        try{
          if(!icon.complete) await new Promise((resolve,reject)=>{icon.addEventListener('load',resolve,{once:true});icon.addEventListener('error',reject,{once:true});});
          await icon.decode();
          if(icon.naturalWidth!==512||icon.naturalHeight!==512) throw new Error('Invalid icon dimensions');
          iconReady=true;
          syncButton();
        }catch{
          icon.hidden=true;
          setStatus('The commercial icon could not be verified. Reload this page once.',true);
          button.disabled=true;
          button.textContent='Reload required';
        }
      }

      window.addEventListener('beforeinstallprompt',event=>{
        event.preventDefault();
        promptEvent=event;
        setStatus('');
        syncButton();
      });

      window.addEventListener('appinstalled',()=>{
        promptEvent=null;
        setStatus('Installation complete.');
        button.dataset.mode='open';
        button.textContent='Open GraxCare Ready';
        button.disabled=false;
      });

      button.addEventListener('click',async()=>{
        if(!iconReady) return;
        if(button.dataset.mode==='install'&&promptEvent){
          button.disabled=true;
          promptEvent.prompt();
          const choice=await promptEvent.userChoice;
          promptEvent=null;
          if(choice.outcome==='accepted'){
            setStatus('Installation complete.');
            button.dataset.mode='open';
            button.textContent='Open GraxCare Ready';
            button.disabled=false;
          }else{
            setStatus('Installation not completed.');
            syncButton();
          }
          return;
        }
        location.href='./?build=compact-commercial-20260807v';
      });

      if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
      verifyIcon();

      setTimeout(()=>{
        if(!promptEvent&&!standalone&&iconReady){
          setStatus('To install, use Chrome menu → Install app.');
          syncButton();
        }
      },2200);
    })();
  </script>
</body>
</html>
