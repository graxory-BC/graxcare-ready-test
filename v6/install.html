<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061a38">
  <meta name="description" content="Install GraxCare Ready — The 60-Second Family Care Action System.">
  <title>Install GraxCare Ready</title>
  <link rel="manifest" href="./manifest-commercial.webmanifest?r=commercial-hq-20260807s">
  <link rel="icon" href="./assets/graxcare-icon-192.png?v=20260807s" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./assets/graxcare-icon-512.png?v=20260807s">
  <style>
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6fa;color:#0d1b3d}
    body{display:grid;place-items:center;padding:22px}
    .card{width:min(420px,100%);background:#fff;border:1px solid #dde4ec;border-radius:28px;padding:30px 24px 28px;box-shadow:0 22px 60px rgba(6,26,56,.14);text-align:center}
    .icon-shell{width:154px;height:154px;margin:0 auto 20px;display:grid;place-items:center;border-radius:32px;background:#fff;border:1px solid #e3e8ef;box-shadow:0 14px 32px rgba(13,27,61,.12);overflow:hidden}
    .icon-shell img{width:144px;height:144px;object-fit:contain;display:block}
    .eyebrow{margin:0 0 7px;color:#087c76;font-size:11px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}
    h1{margin:0;font-size:29px;line-height:1.08;letter-spacing:-.035em}
    .tagline{margin:10px auto 23px;max-width:310px;color:#53647c;line-height:1.42;font-size:15px}
    .button{width:100%;min-height:54px;border:0;border-radius:15px;padding:14px 16px;background:#087c76;color:#fff;font-weight:850;font-size:16px;cursor:pointer;box-shadow:0 7px 18px rgba(8,124,118,.18)}
    .button:disabled{opacity:.68;cursor:wait}
    .status{min-height:20px;margin:14px 0 0;font-size:12.5px;line-height:1.4;color:#6b7789}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon-shell"><img src="./assets/graxcare-icon-1024.png?v=20260807s" width="144" height="144" alt="GraxCare Ready"></div>
    <p class="eyebrow">Official version</p>
    <h1>GraxCare Ready</h1>
    <p class="tagline">The 60-Second Family Care Action System</p>
    <button id="primaryButton" class="button" type="button" disabled>Preparing installation…</button>
    <p id="status" class="status">Preparing this device.</p>
  </main>
  <script>
    (()=>{
      const button=document.getElementById('primaryButton');
      const status=document.getElementById('status');
      let promptEvent=null;
      const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

      function showOpen(message='Ready to open.'){
        button.disabled=false;
        button.textContent='Open GraxCare Ready';
        button.dataset.mode='open';
        status.textContent=message;
      }

      if(standalone) showOpen('Already installed on this device.');

      window.addEventListener('beforeinstallprompt',event=>{
        event.preventDefault();
        promptEvent=event;
        button.disabled=false;
        button.dataset.mode='install';
        button.textContent='Install GraxCare Ready';
        status.textContent='Ready to install.';
      });

      window.addEventListener('appinstalled',()=>{
        promptEvent=null;
        showOpen('Installation complete.');
      });

      button.addEventListener('click',async()=>{
        if(button.dataset.mode==='install'&&promptEvent){
          button.disabled=true;
          promptEvent.prompt();
          const choice=await promptEvent.userChoice;
          promptEvent=null;
          if(choice.outcome==='accepted') showOpen('Installation complete.');
          else {
            button.disabled=false;
            button.textContent='Install GraxCare Ready';
            button.dataset.mode='install';
            status.textContent='Installation not completed.';
          }
          return;
        }
        location.href='./?build=compact-commercial-20260807s';
      });

      if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});

      setTimeout(()=>{
        if(!promptEvent&&!standalone){
          showOpen('Use Chrome menu → Install app to add it to your home screen.');
        }
      },2200);
    })();
  </script>
</body>
</html>
