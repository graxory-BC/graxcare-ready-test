<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061a38">
<title>Install GraxCare Ready</title>
<link rel="manifest" href="./manifest-commercial.webmanifest?r=visual-sync-20260813e-clean">
<link rel="icon" href="./assets/graxcare-emblem-install-192.png?v=visual-sync-20260813e-clean" sizes="192x192" type="image/png">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fa;font-family:system-ui,sans-serif;color:#0d1b3d}.card{width:min(390px,88vw);background:#fff;padding:28px;border-radius:26px;text-align:center;box-shadow:0 18px 50px rgba(6,26,56,.14)}img{width:150px;height:150px;object-fit:contain}.brand{font:700 30px Georgia,serif;margin:8px 0}.brand span{color:#0a8f83}.btn{width:100%;min-height:54px;border:0;border-radius:15px;background:#087c76;color:#fff;font-weight:800;font-size:16px}</style>
</head>
<body><main class="card"><img src="./assets/graxcare-emblem-premium.svg?v=visual-sync-20260813e-clean" alt="GraxCare Ready emblem"><div class="brand">GraxCare <span>Ready</span></div><p>The 60-Second Family Care Action System</p><button id="b" class="btn">Preparing installation…</button></main>
<script>(()=>{let p=null;const b=document.getElementById('b');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();p=e;b.textContent='Install GraxCare Ready';b.onclick=async()=>{p.prompt();await p.userChoice;location.href='./?fresh=20260813e';};});setTimeout(()=>{if(!p){b.textContent='Open GraxCare Ready';b.onclick=()=>location.href='./?fresh=20260813e';}},1800);if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});})();</script></body></html>
