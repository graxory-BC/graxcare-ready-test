name: V6 Targeted Smoke

on:
  pull_request:
    paths:
      - 'v6/**'
      - 'app.js'
      - 'refresh-v6.html'
      - '.github/workflows/v6-visual-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify binary icon files
        run: |
          test -f v6/assets/graxcare-icon-512.png
          test -f v6/assets/graxcare-icon-192.png
          echo '433a1b654fac90b9ec8b8b8cf82e8388f213d47f0b1fe82bc79eae154d8c20d4  v6/assets/graxcare-icon-512.png' | sha256sum -c -
          file v6/assets/graxcare-icon-512.png | grep -q 'PNG image data, 512 x 512'
          file v6/assets/graxcare-icon-192.png | grep -q 'PNG image data, 192 x 192'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start V6
        run: |
          python3 -m http.server 4173 --directory . >/tmp/graxcare-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/v6/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/graxcare-server.log
          exit 1
      - name: Verify mobile navigation and rendered commercial identity
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:3,serviceWorkers:'allow'});
            const page=await context.newPage();

            await page.goto('http://127.0.0.1:4173/v6/?ci=20260807v',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#situationsGrid .situation-card');
            await page.waitForFunction(()=>document.querySelector('.brand-logo-master')?.naturalWidth===512,{timeout:5000});
            const brand=await page.evaluate(()=>{
              const image=document.querySelector('.brand-logo-master');
              return {width:image?.naturalWidth||0,height:image?.naturalHeight||0,src:image?.getAttribute('src')||'',broken:[...document.images].filter(img=>img.complete&&img.naturalWidth===0).length};
            });
            assert.deepEqual([brand.width,brand.height],[512,512],'in-app commercial logo is not 512x512');
            assert.ok(brand.src.includes('graxcare-icon-512.png'),'in-app logo is not the verified PNG');
            assert.equal(brand.broken,0,'in-app screen contains a broken image');

            const routes=[
              ['followup','followupView','Keep the next steps organized.'],
              ['backup','backupView','Backup and restore'],
              ['help','helpView','How GraxCare Ready works'],
              ['home','homeView','When something changes, everyone knows what to do next.']
            ];
            for(const [route,id,text] of routes){
              await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
              await page.click(`.bottom-nav .nav-button[data-route="${route}"]`);
              await page.waitForTimeout(140);
              const state=await page.evaluate(({route,id})=>{
                const target=document.getElementById(id);
                const header=document.querySelector('.app-header');
                return {
                  hidden:target.hidden,
                  display:getComputedStyle(target).display,
                  top:target.getBoundingClientRect().top,
                  headerBottom:header?.getBoundingClientRect().bottom||0,
                  active:document.querySelector('.bottom-nav .nav-button.active')?.dataset.route,
                  visible:[...document.querySelectorAll('.view')].filter(v=>!v.hidden).map(v=>v.dataset.view)
                };
              },{route,id});
              assert.equal(state.hidden,false,`${route}: hidden`);
              assert.notEqual(state.display,'none',`${route}: not rendered`);
              assert.equal(state.active,route,`${route}: active state wrong`);
              assert.deepEqual(state.visible,[route],`${route}: more than one primary view visible`);
              assert.ok(state.top<=state.headerBottom+20,`${route}: section not brought into first viewport`);
              await page.getByText(text,{exact:false}).first().waitFor({state:'visible'});
            }

            await page.goto('http://127.0.0.1:4173/v6/install.html?ci=20260807v',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#installIcon',{state:'visible',timeout:5000});
            await page.waitForFunction(()=>document.querySelector('#installIcon')?.naturalWidth===512,{timeout:5000});
            const install=await page.evaluate(async()=>{
              const image=document.querySelector('#installIcon');
              const manifest=await fetch('./manifest-commercial.webmanifest?ci=20260807v',{cache:'no-store'}).then(r=>r.json());
              return {
                width:image?.naturalWidth||0,
                height:image?.naturalHeight||0,
                src:image?.getAttribute('src')||'',
                broken:[...document.images].filter(img=>img.complete&&img.naturalWidth===0).length,
                buttons:document.querySelectorAll('main.card button').length,
                text:document.body.innerText,
                html:document.documentElement.innerHTML,
                icons:manifest.icons||[]
              };
            });
            assert.deepEqual([install.width,install.height],[512,512],'install commercial icon is not 512x512');
            assert.ok(install.src.includes('graxcare-icon-512.png'),'install page is not using the verified PNG');
            assert.equal(install.broken,0,'install screen contains a broken image');
            assert.equal(install.buttons,1,'install screen has duplicate primary actions');
            assert.ok(!install.text.includes('Official version'),'extra install label remains visible');
            assert.ok(!install.text.includes('Commercial identity'),'duplicated commercial proof text remains visible');
            assert.ok(!install.html.includes('raw.githubusercontent.com'),'install screen depends on an external raw GitHub image');
            assert.deepEqual(install.icons.map(i=>[i.sizes,i.type]),[['192x192','image/png'],['512x512','image/png']],'manifest PNG sizes/types are wrong');
            assert.ok(install.icons.every(i=>i.src.startsWith('./assets/graxcare-icon-')&&!i.src.includes('raw.githubusercontent.com')),'manifest icon path is not same-origin PNG');

            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify protected logic unchanged
        run: |
          ! grep -q "stopImmediatePropagation" v6/update-shell.js
          grep -q "commercial-hq-20260807v" v6/manifest-commercial.webmanifest
          grep -q "graxcare-icon-512.png" v6/install.html
          grep -q "graxcare-icon-512.png" v6/commercial-logo.js
          ! grep -q "graxcare-logo-master-small.b64.txt" v6/commercial-logo.js
          ! grep -q "graxcare-app-icon.svg" v6/install.html
          grep -q "const STORAGE_KEY = 'graxcare_ready_state_v1';" app.js
          test "$(git hash-object app.js)" = "216ad539cb5daca5c312b522dae79c3f83dae502"
