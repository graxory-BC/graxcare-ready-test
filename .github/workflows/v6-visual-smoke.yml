name: V6 Targeted Smoke

on:
  pull_request:
    paths:
      - 'v6/**'
      - 'app.js'
      - 'refresh-v6.html'
      - '.github/workflows/v6-visual-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start V6
        run: |
          python3 -m http.server 4173 --directory . >/tmp/graxcare-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/v6/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test navigation and premium brand rendering
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},serviceWorkers:'allow'});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4173/v6/?ci=visual-sync-20260811c',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#situationsGrid .situation-card');

            for (const size of [192,512]) {
              const state=await page.evaluate(async(size)=>{
                const response=await fetch(`./assets/graxcare-icon-${size}.png?v=visual-sync-20260811c`,{cache:'no-store'});
                const blob=await response.blob();
                const url=URL.createObjectURL(blob);
                const dims=await new Promise((resolve,reject)=>{
                  const img=new Image();
                  img.onload=()=>resolve({w:img.naturalWidth,h:img.naturalHeight});
                  img.onerror=reject;
                  img.src=url;
                });
                URL.revokeObjectURL(url);
                return {ok:response.ok,type:blob.type,...dims};
              },size);
              assert.equal(state.ok,true,`${size} PNG did not load`);
              assert.equal(state.w,size);
              assert.equal(state.h,size);
              assert.equal(state.type,'image/png');
            }

            const profileId='11111111-1111-4111-8111-111111111111';
            await page.evaluate(({profileId})=>{
              localStorage.setItem('graxcare_ready_state_v1',JSON.stringify({
                version:1,
                profiles:[{id:profileId,name:'Test',relationship:'Dad',age:'',primaryContact:'',primaryPhone:'',doctor:'',pharmacy:'',hospital:'',insurance:'',allergies:'',conditions:'',medications:'',supportNeeds:'',photoDataUrl:''}],
                selectedProfileId:profileId,activeSituationId:null,actionProgress:{},followups:[],updatedAt:new Date().toISOString()
              }));
            },{profileId});
            await page.reload({waitUntil:'domcontentloaded'});
            await page.waitForSelector('#situationsGrid .situation-card[data-situation-id="urgent-care"]:not([disabled])');

            await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
            await page.click('#situationsGrid .situation-card[data-situation-id="urgent-care"]');
            await page.waitForTimeout(140);
            assert.equal(await page.locator('#actionView').evaluate(v=>v.hidden),false);
            const actionTitle=page.locator('#actionContent .action-hero h1');
            await actionTitle.waitFor({state:'visible'});
            assert.equal((await actionTitle.textContent()).trim(),'We need urgent care');

            await page.click('#actionView [data-route="home"]');
            for(const [route,id,text] of [
              ['followup','followupView','Keep the next steps organized.'],
              ['backup','backupView','Backup and restore'],
              ['help','helpView','How GraxCare Ready works'],
              ['home','homeView','When something changes, everyone knows what to do next.']
            ]){
              await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
              await page.click(`.bottom-nav .nav-button[data-route="${route}"]`);
              await page.waitForTimeout(100);
              assert.equal(await page.locator(`#${id}`).evaluate(v=>v.hidden),false,`${route}: hidden`);
              await page.locator(`#${id}`).getByText(text,{exact:false}).first().waitFor({state:'visible'});
            }

            const headerLogo=page.locator('.brand-logo-master');
            await headerLogo.waitFor({state:'attached'});
            const headerState=await headerLogo.evaluate(img=>({complete:img.complete,w:img.naturalWidth,h:img.naturalHeight,src:img.currentSrc||img.src}));
            assert.equal(headerState.complete,true);
            assert.equal(headerState.w,512);
            assert.equal(headerState.h,512);
            assert.ok(headerState.src.includes('graxcare-icon-512.png'));

            const brand=page.locator('.brand-copy');
            assert.equal(await brand.count(),1,'Live wordmark missing');
            assert.equal((await brand.locator('strong').textContent()).trim(),'GraxCare');
            assert.equal((await brand.locator('span').textContent()).trim(),'Ready');
            const brandBox=await brand.boundingBox();
            assert.ok(brandBox && brandBox.width>100 && brandBox.height>15,'Live wordmark is not legible-sized');

            await page.goto('http://127.0.0.1:4173/v6/install.html?ci=visual-sync-20260811c',{waitUntil:'domcontentloaded'});
            await page.getByText('The 60-Second Family Care Action System',{exact:true}).waitFor({state:'visible'});
            await page.getByText('GraxCare',{exact:true}).waitFor({state:'visible'});
            await page.getByText('Ready',{exact:true}).waitFor({state:'visible'});
            const installLogo=page.locator('#installLogo');
            await installLogo.waitFor({state:'visible'});
            const installState=await installLogo.evaluate(img=>({complete:img.complete,w:img.naturalWidth,h:img.naturalHeight,src:img.currentSrc||img.src,borderRadius:getComputedStyle(img).borderRadius}));
            assert.equal(installState.complete,true);
            assert.equal(installState.w,512);
            assert.equal(installState.h,512);
            assert.ok(installState.src.includes('graxcare-icon-512.png'));
            assert.notEqual(installState.borderRadius,'0px');
            const installBrandBox=await page.locator('.install-brand').boundingBox();
            assert.ok(installBrandBox && installBrandBox.width>220 && installBrandBox.height>25,'Install wordmark is too small');

            const manifest=await page.evaluate(async()=>await (await fetch('./manifest-commercial.webmanifest?r=visual-sync-20260811c')).json());
            assert.equal(manifest.name,'GraxCare Ready');
            assert.equal(manifest.id,'./graxcare-ready-commercial-20260808c');
            assert.ok(manifest.icons.some(i=>i.src.includes('graxcare-icon-192.png')&&i.type==='image/png'));
            assert.ok(manifest.icons.some(i=>i.src.includes('graxcare-icon-512.png')&&i.type==='image/png'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify protected logic and premium icon binaries
        run: |
          python3 <<'PY'
          import struct
          for size in (192,512):
              path=f'v6/assets/graxcare-icon-{size}.png'
              data=open(path,'rb').read(24)
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{path}: invalid PNG signature'
              width,height=struct.unpack('>II',data[16:24])
              assert (width,height)==(size,size), f'{path}: wrong size {(width,height)}'
          print('PREMIUM_PNG_ICONS_OK')
          PY
          grep -q "visual-sync-20260811c" v6/manifest-commercial.webmanifest
          grep -q "visual-sync-20260811c" v6/service-worker.js
          grep -q "graxcare-icon-512.png" v6/commercial-logo.js
          grep -q "brand-copy" v6/commercial-logo.css
          grep -q "install-brand" v6/install.html
          grep -q "const STORAGE_KEY = 'graxcare_ready_state_v1';" app.js
          test "$(git hash-object app.js)" = "216ad539cb5daca5c312b522dae79c3f83dae502"
