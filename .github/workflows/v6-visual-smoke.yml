name: V6 Visual Smoke

on:
  pull_request:
    paths:
      - 'v6/**'
      - 'app.js'
      - '.github/workflows/v6-visual-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local V6 server
        run: |
          python3 -m http.server 4173 --directory . >/tmp/graxcare-server.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/v6/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/graxcare-server.log
          exit 1

      - name: Validate compact commercial V6 in Chromium
        run: |
          mkdir -p visual-artifacts
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          async function inspect(page, name) {
            await page.goto('http://127.0.0.1:4173/v6/?ci=compact-commercial-20260807m', {
              waitUntil: 'domcontentloaded'
            });
            await page.waitForSelector('#situationsGrid .situation-card');
            await page.waitForTimeout(900);

            const result = await page.evaluate(() => {
              const card = document.querySelector('#situationsGrid .situation-card');
              const icon = card?.querySelector('.situation-icon');
              const cardStyle = card ? getComputedStyle(card) : null;
              const iconStyle = icon ? getComputedStyle(icon) : null;
              const artStyle = icon ? getComputedStyle(icon, '::before') : null;
              const navButton = document.querySelector('.bottom-nav .nav-button:nth-child(2)');
              const navIcon = navButton?.querySelector('span');
              const navIconStyle = navIcon ? getComputedStyle(navIcon) : null;
              const navArtStyle = navIcon ? getComputedStyle(navIcon, '::before') : null;
              const manifest = document.querySelector('link[rel="manifest"]')?.getAttribute('href') || '';
              const favicon = document.querySelector('link[rel="icon"]')?.getAttribute('href') || '';

              return {
                width: innerWidth,
                build: document.documentElement.dataset.visualBuild || '',
                compactStylePresent: !!document.getElementById('gcr-compact-commercial-m'),
                cardCount: document.querySelectorAll('#situationsGrid .situation-card').length,
                navCount: document.querySelectorAll('.bottom-nav .nav-button').length,
                navLabels: [...document.querySelectorAll('.bottom-nav .nav-button')].map(button => button.lastChild?.textContent.trim() || ''),
                slogan: document.querySelector('.hero-card .eyebrow')?.textContent.trim() || '',
                manifest,
                favicon,
                cardMinHeight: parseFloat(cardStyle?.minHeight || '0'),
                iconWidth: parseFloat(iconStyle?.width || '0'),
                iconHeight: parseFloat(iconStyle?.height || '0'),
                artBackground: artStyle?.backgroundImage || 'none',
                artMask: artStyle?.maskImage || artStyle?.webkitMaskImage || 'none',
                labelSize: parseFloat(getComputedStyle(card.querySelector('strong')).fontSize || '0'),
                navIconWidth: parseFloat(navIconStyle?.width || '0'),
                navArtMask: navArtStyle?.maskImage || navArtStyle?.webkitMaskImage || 'none',
                navArtBackground: navArtStyle?.backgroundImage || 'none',
                overflowX: document.documentElement.scrollWidth - document.documentElement.clientWidth
              };
            });

            await page.screenshot({ path: `visual-artifacts/v6-${name}.png`, fullPage: true });

            assert.equal(result.build, 'compact-commercial-20260807m', `${name}: compact commercial visual shell is not active`);
            assert.equal(result.compactStylePresent, true, `${name}: compact commercial style element is missing`);
            assert.equal(result.cardCount, 12, `${name}: expected 12 situation cards`);
            assert.equal(result.navCount, 4, `${name}: expected 4 navigation items`);
            assert.deepEqual(result.navLabels, ['Home','Follow Up','Backup','Help'], `${name}: navigation labels changed`);
            assert.equal(result.slogan, 'The 60-Second Family Care Action System', `${name}: 60-second positioning changed`);
            assert.ok(result.manifest.includes('compact-commercial-20260807m'), `${name}: refreshed manifest is missing`);
            assert.ok(result.favicon.includes('graxcare-app-icon.svg'), `${name}: commercial browser icon is missing`);
            assert.ok(result.artBackground && result.artBackground.includes('data:image/svg+xml'), `${name}: premium situation art is not active`);
            assert.ok(!result.artMask || result.artMask === 'none', `${name}: situation art unexpectedly uses an obsolete mask`);
            assert.ok(result.navArtBackground && result.navArtBackground.includes('data:image/svg+xml'), `${name}: bottom navigation artwork is not visible`);
            assert.ok(!result.navArtMask || result.navArtMask === 'none', `${name}: bottom navigation unexpectedly uses the broken mask implementation`);
            assert.ok(result.overflowX <= 1, `${name}: horizontal overflow detected (${result.overflowX}px)`);

            if (result.width <= 719) {
              assert.ok(result.cardMinHeight >= 84 && result.cardMinHeight <= 92, `${name}: compact card height is outside target range (${result.cardMinHeight}px)`);
              assert.ok(result.iconWidth >= 36 && result.iconWidth <= 42 && result.iconHeight >= 36 && result.iconHeight <= 42, `${name}: compact situation icon size is outside target range (${result.iconWidth}x${result.iconHeight})`);
              assert.ok(result.labelSize >= 10 && result.labelSize <= 11, `${name}: compact label size is outside target range (${result.labelSize}px)`);
              assert.ok(result.navIconWidth >= 29 && result.navIconWidth <= 32, `${name}: mobile bottom icon container is outside target range (${result.navIconWidth}px)`);
            } else {
              assert.ok(result.cardMinHeight >= 120 && result.cardMinHeight <= 140, `${name}: desktop card height changed unexpectedly (${result.cardMinHeight}px)`);
              assert.ok(result.iconWidth >= 48 && result.iconWidth <= 64 && result.iconHeight >= 48 && result.iconHeight <= 64, `${name}: desktop situation icon size changed unexpectedly (${result.iconWidth}x${result.iconHeight})`);
              assert.ok(result.labelSize >= 12 && result.labelSize <= 15, `${name}: desktop label size changed unexpectedly (${result.labelSize}px)`);
            }

            console.log(name, JSON.stringify(result, null, 2));
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const mobile = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1, serviceWorkers: 'allow' });
              const mobilePage = await mobile.newPage();
              await inspect(mobilePage, 'mobile-390');
              await mobilePage.reload({ waitUntil: 'domcontentloaded' });
              await inspect(mobilePage, 'mobile-390-reload');
              await mobile.close();

              const desktop = await browser.newContext({ viewport: { width: 1440, height: 1200 }, deviceScaleFactor: 1, serviceWorkers: 'allow' });
              const desktopPage = await desktop.newPage();
              await inspect(desktopPage, 'desktop-1440');
              await desktop.close();
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify commercial icon, cache and protected logic
        run: |
          grep -q "compact-commercial-20260807m" v6/update-shell.js
          grep -q "graxcare-ready-compact-commercial-20260807m" v6/service-worker.js
          grep -q "graxcare-app-icon.svg?r=commercial-master-20260807m" v6/manifest.webmanifest
          grep -q "data:image/webp;base64" v6/assets/graxcare-app-icon.svg
          ! grep -q "placeholder-icon" v6/manifest.webmanifest
          grep -q "const STORAGE_KEY = 'graxcare_ready_state_v1';" app.js
          test "$(git hash-object app.js)" = "216ad539cb5daca5c312b522dae79c3f83dae502"

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graxcare-v6-visual-smoke
          path: visual-artifacts/
          if-no-files-found: warn
