name: V6 Targeted Smoke

on:
  pull_request:
    paths:
      - 'v6/**'
      - 'app.js'
      - 'refresh-v6.html'
      - '.github/workflows/v6-visual-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start V6
        run: |
          python3 -m http.server 4173 --directory . >/tmp/graxcare-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/v6/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Test situation focus, navigation, install presentation and rendered logo
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},serviceWorkers:'allow'});
            const page=await context.newPage();
            await page.goto('http://127.0.0.1:4173/v6/?ci=visual-sync-20260808d',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#situationsGrid .situation-card');

            await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
            await page.click('#situationsGrid .situation-card[data-situation-id="urgent-care"]');
            await page.waitForTimeout(140);
            const actionState=await page.evaluate(()=>{
              const view=document.getElementById('actionView');
              const hero=document.querySelector('#actionContent .action-hero');
              const header=document.querySelector('.app-header');
              return {
                hidden:view.hidden,
                heroText:hero?.querySelector('h1')?.textContent?.trim()||'',
                top:hero?.getBoundingClientRect().top??9999,
                headerBottom:header?.getBoundingClientRect().bottom||0,
                visible:[...document.querySelectorAll('.view')].filter(v=>!v.hidden).map(v=>v.dataset.view)
              };
            });
            assert.equal(actionState.hidden,false,'action: hidden after situation selection');
            assert.equal(actionState.heroText,'We need urgent care','action: wrong situation opened');
            assert.deepEqual(actionState.visible,['action'],'action: more than one view visible');
            assert.ok(actionState.top>=actionState.headerBottom-2,'action: hero hidden behind header');
            assert.ok(actionState.top<=actionState.headerBottom+24,'action: selected situation not brought directly into viewport');

            await page.click('#actionView [data-route="home"]');
            await page.waitForTimeout(120);
            const routes=[
              ['followup','followupView','Keep the next steps organized.'],
              ['backup','backupView','Backup and restore'],
              ['help','helpView','How GraxCare Ready works'],
              ['home','homeView','When something changes, everyone knows what to do next.']
            ];
            for(const [route,id,text] of routes){
              await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
              await page.click(`.bottom-nav .nav-button[data-route="${route}"]`);
              await page.waitForTimeout(120);
              const state=await page.evaluate(({route,id})=>{
                const target=document.getElementById(id);
                const header=document.querySelector('.app-header');
                return {
                  hidden:target.hidden,
                  display:getComputedStyle(target).display,
                  top:target.getBoundingClientRect().top,
                  headerBottom:header?.getBoundingClientRect().bottom||0,
                  active:document.querySelector('.bottom-nav .nav-button.active')?.dataset.route,
                  visible:[...document.querySelectorAll('.view')].filter(v=>!v.hidden).map(v=>v.dataset.view)
                };
              },{route,id});
              assert.equal(state.hidden,false,`${route}: hidden`);
              assert.notEqual(state.display,'none',`${route}: not rendered`);
              assert.equal(state.active,route,`${route}: active state wrong`);
              assert.deepEqual(state.visible,[route],`${route}: more than one primary view visible`);
              assert.ok(state.top<=state.headerBottom+20,`${route}: section not brought into first viewport`);
              await page.getByText(text,{exact:false}).first().waitFor({state:'visible'});
            }

            const headerLogo=page.locator('.brand-logo-master');
            await headerLogo.waitFor({state:'visible'});
            const headerLogoState=await headerLogo.evaluate(img=>({complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,src:img.currentSrc||img.src}));
            assert.equal(headerLogoState.complete,true,'Header logo did not finish loading');
            assert.ok(headerLogoState.naturalWidth>0 && headerLogoState.naturalHeight>0,'Header logo did not render');
            assert.ok(headerLogoState.src.includes('graxcare-logo-source.webp'),'Header logo is not using verified local source');

            await page.goto('http://127.0.0.1:4173/v6/install.html?ci=visual-sync-20260808c',{waitUntil:'domcontentloaded'});
            assert.equal(await page.locator('h1').count(),0,'Duplicated GraxCare Ready heading still present');
            await page.getByText('The 60-Second Family Care Action System',{exact:true}).waitFor({state:'visible'});
            const logo=page.locator('#installLogo');
            await logo.waitFor({state:'visible'});
            const logoState=await logo.evaluate(img=>({complete:img.complete,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,src:img.currentSrc||img.src}));
            assert.equal(logoState.complete,true,'Install logo did not finish loading');
            assert.ok(logoState.naturalWidth>0 && logoState.naturalHeight>0,'Install logo did not render');
            assert.ok(logoState.src.includes('graxcare-logo-source.webp') || logoState.src.includes('graxcare-icon-512.png'),'Install logo is not using a verified local asset');
            await page.getByRole('button',{name:/GraxCare Ready/}).waitFor({state:'visible'});
            const cardState=await page.locator('.card').evaluate(el=>{
              const r=el.getBoundingClientRect();
              return {centerX:r.left+r.width/2,centerY:r.top+r.height/2,vw:innerWidth,vh:innerHeight};
            });
            assert.ok(Math.abs(cardState.centerX-cardState.vw/2)<=2,'Install card is not horizontally centered');
            assert.ok(Math.abs(cardState.centerY-cardState.vh/2)<=2,'Install card is not vertically centered');

            const manifest=await page.evaluate(async()=>await (await fetch('./manifest-commercial.webmanifest?r=visual-sync-20260808c')).json());
            assert.equal(manifest.name,'GraxCare Ready');
            assert.equal(manifest.description,'The 60-Second Family Care Action System');
            assert.ok(manifest.icons.some(i=>i.src.includes('graxcare-icon-192.png')&&i.type==='image/png'));
            assert.ok(manifest.icons.some(i=>i.src.includes('graxcare-icon-512.png')&&i.type==='image/png'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Verify PNG binaries and protected logic
        run: |
          python3 <<'PY'
          import struct
          for size in (192,512,1024):
              path=f'v6/assets/graxcare-icon-{size}.png'
              data=open(path,'rb').read(24)
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'{path}: invalid PNG signature'
              width,height=struct.unpack('>II',data[16:24])
              assert (width,height)==(size,size), f'{path}: wrong size {(width,height)}'
          raw=open('v6/assets/graxcare-logo-source.webp','rb').read(12)
          assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP', 'verified source is not a real WebP'
          print('PNG_AND_SOURCE_OK')
          PY
          grep -q "visual-sync-20260808d" v6/update-shell.js
          grep -q "revealSelectedAction" v6/update-shell.js
          ! grep -q "stopImmediatePropagation" v6/update-shell.js
          grep -q "visual-sync-20260808c" v6/manifest-commercial.webmanifest
          grep -q "graxcare-icon-192.png" v6/manifest-commercial.webmanifest
          grep -q "graxcare-icon-512.png" v6/manifest-commercial.webmanifest
          ! grep -q "graxcare-icon-source-20260807.svg" v6/install.html
          ! grep -q "graxcare-icon-source-20260807.svg" v6/manifest-commercial.webmanifest
          ! grep -q "graxcare-icon-source-20260807.svg" v6/service-worker.js
          ! grep -q "<h1>GraxCare Ready</h1>" v6/install.html
          test -s v6/visual-sync.css
          grep -q "const STORAGE_KEY = 'graxcare_ready_state_v1';" app.js
          test "$(git hash-object app.js)" = "216ad539cb5daca5c312b522dae79c3f83dae502"