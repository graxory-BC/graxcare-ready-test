name: Build verified commercial icons

on:
  push:
    branches:
      - agent/graxcare-verified-icon-fix
    paths:
      - 'v6/assets/_verified_icon_parts/**'
      - '.github/workflows/build-verified-commercial-icons.yml'

permissions:
  contents: write

jobs:
  build-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graxcare-verified-icon-fix
      - name: Reconstruct verified 512 PNG
        run: |
          cat v6/assets/_verified_icon_parts/part*.b64 | tr -d '\n\r ' | base64 -d > v6/assets/graxcare-icon-512.png
          echo '433a1b654fac90b9ec8b8b8cf82e8388f213d47f0b1fe82bc79eae154d8c20d4  v6/assets/graxcare-icon-512.png' | sha256sum -c -
          file v6/assets/graxcare-icon-512.png
          identify v6/assets/graxcare-icon-512.png
          test "$(identify -format '%wx%h' v6/assets/graxcare-icon-512.png)" = '512x512'
      - name: Build 192 PNG
        run: |
          convert v6/assets/graxcare-icon-512.png -filter Lanczos -resize 192x192 v6/assets/graxcare-icon-192.png
          file v6/assets/graxcare-icon-192.png
          test "$(identify -format '%wx%h' v6/assets/graxcare-icon-192.png)" = '192x192'
      - name: Commit binary icons
        run: |
          git config user.name 'GraxCare Build'
          git config user.email 'actions@users.noreply.github.com'
          git add v6/assets/graxcare-icon-512.png v6/assets/graxcare-icon-192.png
          git diff --cached --quiet && exit 0
          git commit -m 'Add verified commercial PNG icons'
          git push origin HEAD:agent/graxcare-verified-icon-fix
