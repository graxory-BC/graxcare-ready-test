name: GraxCare verified icon build

on:
  push:
    branches:
      - agent/graxcare-install-icon-final-fix
    paths:
      - '.github/workflows/graxcare-icon-build.yml'
      - 'v6/assets/source-parts/**'

permissions:
  contents: write

jobs:
  build-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graxcare-install-icon-final-fix

      - name: Install image validator
        run: python -m pip install --disable-pip-version-check pillow

      - name: Reconstruct and verify approved source
        shell: python
        run: |
          import base64, hashlib, io
          from pathlib import Path
          from PIL import Image

          expected_sha = '87a40d3af8a2e3762123387c8780be16673abfee7e543881bf003edb450c51f5'
          parts = sorted(Path('v6/assets/source-parts').glob('gcr-source-*.b64'))
          if len(parts) != 7:
              raise SystemExit(f'Expected 7 source parts, found {len(parts)}')

          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'SOURCE SHA MISMATCH: {actual_sha}')

          source = Image.open(io.BytesIO(raw)).convert('RGBA')
          if source.size != (394, 347):
              raise SystemExit(f'Unexpected source dimensions: {source.size}')

          source_path = Path('v6/assets/graxcare-logo-source.webp')
          source_path.write_bytes(raw)

          def make_icon(size):
              canvas = Image.new('RGBA', (size, size), (255,255,255,255))
              target_w = round(size * 0.90)
              target_h = round(source.height * target_w / source.width)
              resized = source.resize((target_w, target_h), Image.Resampling.LANCZOS)
              canvas.alpha_composite(resized, ((size-target_w)//2, (size-target_h)//2))
              return canvas.convert('RGB')

          for size in (192, 512, 1024):
              target = Path(f'v6/assets/graxcare-icon-{size}.png')
              make_icon(size).save(target, 'PNG', optimize=True)
              check = Image.open(target)
              if check.format != 'PNG' or check.size != (size, size):
                  raise SystemExit(f'Invalid generated icon: {target}')

          print('SOURCE_SHA_OK', actual_sha)
          print('SOURCE_SIZE_OK', source.size)
          print('PNG_192_OK')
          print('PNG_512_OK')
          print('PNG_1024_OK')

      - name: Commit verified binary assets
        run: |
          git config user.name "GraxCare Build"
          git config user.email "actions@users.noreply.github.com"
          git add v6/assets/graxcare-logo-source.webp \
                  v6/assets/graxcare-icon-192.png \
                  v6/assets/graxcare-icon-512.png \
                  v6/assets/graxcare-icon-1024.png
          git diff --cached --quiet && exit 0
          git commit -m "Add SHA-verified GraxCare install icons"
          git push origin HEAD:agent/graxcare-install-icon-final-fix
