name: Build verified PWA icons

on:
  push:
    branches:
      - agent/graxcare-install-premium-fix

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graxcare-install-premium-fix
      - name: Build PNG icons from verified locked logo data
        run: |
          base64 -d v6/assets/graxcare-logo-master-small.b64.txt > /tmp/graxcare-master.webp
          identify /tmp/graxcare-master.webp
          convert /tmp/graxcare-master.webp -filter Lanczos -resize 161x142 -gravity center -background white -extent 192x192 v6/assets/graxcare-icon-192.png
          convert /tmp/graxcare-master.webp -filter Lanczos -resize 430x379 -gravity center -background white -extent 512x512 v6/assets/graxcare-icon-512.png
          convert /tmp/graxcare-master.webp -filter Lanczos -resize 860x757 -gravity center -background white -extent 1024x1024 v6/assets/graxcare-icon-1024.png
          identify v6/assets/graxcare-icon-192.png
          identify v6/assets/graxcare-icon-512.png
          identify v6/assets/graxcare-icon-1024.png
      - name: Commit generated PNG icons
        run: |
          git config user.name "GraxCare Build"
          git config user.email "actions@users.noreply.github.com"
          git add v6/assets/graxcare-icon-192.png v6/assets/graxcare-icon-512.png v6/assets/graxcare-icon-1024.png
          git diff --cached --quiet && exit 0
          git commit -m "Build verified PNG icons from locked GraxCare logo"
          git push origin HEAD:agent/graxcare-install-premium-fix
