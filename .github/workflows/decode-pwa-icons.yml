name: Build GraxCare visual assets

on:
  push:
    branches:
      - agent/graxcare-visual-sync-shopify
    paths:
      - 'v6/assets/graxcare-icon-source-20260807.svg'
      - '.github/workflows/decode-pwa-icons.yml'

permissions:
  contents: write

jobs:
  build-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graxcare-visual-sync-shopify

      - name: Install deterministic image renderer
        run: python -m pip install --disable-pip-version-check pillow

      - name: Render PNG assets from the approved supplied source
        shell: python
        run: |
          import base64, io, re
          from pathlib import Path
          from PIL import Image, ImageFilter

          svg_path = Path('v6/assets/graxcare-icon-source-20260807.svg')
          svg = svg_path.read_text(encoding='utf-8')
          match = re.search(r'href="data:image/webp;base64,([A-Za-z0-9+/=]+)"', svg)
          if not match:
              raise SystemExit('Approved embedded source not found')

          raw = base64.b64decode(match.group(1), validate=True)
          source = Image.open(io.BytesIO(raw)).convert('RGBA')
          if source.size != (394, 347):
              raise SystemExit(f'Unexpected approved source size: {source.size}')

          # Remove only the isolated top-edge capture artifact; the logo itself is unchanged.
          px = source.load()
          for y in range(0, 5):
              for x in range(170, 196):
                  if px[x, y][3] > 0:
                      px[x, y] = (255, 255, 255, 0)

          out = Path('v6/assets')
          source.save(out / 'graxcare-logo-master-source.png', optimize=True)
          bbox = source.getchannel('A').getbbox()
          if not bbox:
              raise SystemExit('Approved source became empty')
          content = source.crop(bbox)

          def square_icon(size):
              canvas = Image.new('RGBA', (size, size), (255, 255, 255, 255))
              target_w = int(size * 0.88)
              target_h = round(content.height * target_w / content.width)
              resized = content.resize((target_w, target_h), Image.Resampling.LANCZOS)
              if size >= 512:
                  resized = resized.filter(ImageFilter.UnsharpMask(radius=0.8, percent=75, threshold=2))
              canvas.alpha_composite(resized, ((size-target_w)//2, (size-target_h)//2))
              return canvas.convert('RGB')

          for size in (192, 512, 1024):
              target = out / f'graxcare-icon-{size}.png'
              square_icon(size).save(target, optimize=True)
              check = Image.open(target)
              if check.format != 'PNG' or check.size != (size, size):
                  raise SystemExit(f'Invalid output: {target}')

          # High-resolution transparent brand asset for Shopify/desktop compositions.
          target_w = 1600
          target_h = round(content.height * target_w / content.width)
          brand = content.resize((target_w, target_h), Image.Resampling.LANCZOS)
          brand = brand.filter(ImageFilter.UnsharpMask(radius=0.9, percent=70, threshold=2))
          brand.save(out / 'graxcare-logo-master-1600.png', optimize=True)

          print('SOURCE_OK', source.size)
          print('ICON_192_OK', Image.open(out/'graxcare-icon-192.png').size)
          print('ICON_512_OK', Image.open(out/'graxcare-icon-512.png').size)
          print('ICON_1024_OK', Image.open(out/'graxcare-icon-1024.png').size)

      - name: Commit validated local assets
        run: |
          git config user.name "GraxCare Build"
          git config user.email "actions@users.noreply.github.com"
          git add v6/assets/graxcare-logo-master-source.png \
                  v6/assets/graxcare-icon-192.png \
                  v6/assets/graxcare-icon-512.png \
                  v6/assets/graxcare-icon-1024.png \
                  v6/assets/graxcare-logo-master-1600.png
          git diff --cached --quiet && exit 0
          git commit -m "Build premium icons from approved GraxCare source"
          git push origin HEAD:agent/graxcare-visual-sync-shopify
