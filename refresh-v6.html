<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061a38">
  <title>Updating GraxCare Ready</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f7fb;color:#0d1b3d}
    body{display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);padding:28px;border-radius:24px;background:#fff;box-shadow:0 18px 54px rgba(13,27,61,.15);text-align:center}
    .mark{width:58px;height:58px;margin:0 auto 18px;border:7px solid #d9efec;border-top-color:#087c76;border-radius:50%;animation:spin .8s linear infinite}
    h1{font-size:24px;margin:0 0 10px}p{margin:0;color:#51627a;line-height:1.5}.error{color:#b42318;margin-top:14px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card"><div class="mark" aria-hidden="true"></div><h1>Updating GraxCare Ready</h1><p id="status">Removing the previous visual cache. Your profiles and saved information will not be deleted.</p></main>
  <script>
    (async()=>{
      const status=document.getElementById('status');
      try{
        if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(r=>r.scope.includes('/graxcare-ready-test/v6/')).map(r=>r.unregister()));}
        if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('graxcare-ready-')).map(k=>caches.delete(k)));}
        ['gcr-visual-lock-20260806d','gcr-premium-direct-20260806f','gcr-premium-reset-20260806g','gcr-premium-inline-20260807h','gcr-premium-accessibility-20260807i','gcr-premium-accessibility-final-20260807j','gcr-premium-balance-20260807k','gcr-premium-balance-final-20260807k2','gcr-approved-sync-20260807l'].forEach(k=>sessionStorage.removeItem(k));
        status.textContent='Update completed. Opening the approved GraxCare Ready interface…';
        const target='./v6/?build=approved-sync-20260807l&clean='+Date.now();
        setTimeout(()=>location.replace(target),350);
      }catch(error){status.className='error';status.textContent='The automatic refresh could not finish. Reload this page once.';}
    })();
  </script>
</body>
</html>
