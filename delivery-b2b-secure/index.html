const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function build(){try{let k=location.hash.slice(1);if(!k)throw Error('Falta clave de entrega');let key=await crypto.subtle.importKey('raw',u(k),'AES-GCM',false,['decrypt']);let pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(N)},key,u(C));let got=hex(await crypto.subtle.digest('SHA-256',pt));if(got!==E)throw Error('Hash no coincide');let blob=new Blob([pt],{type:'application/octet-stream'});let url=URL.createObjectURL(blob);let b=document.getElementById('b');b.disabled=false;b.onclick=()=>{let a=document.createElement('a');a.href=url;a.download=F;document.body.appendChild(a);a.click();a.remove()};document.getElementById('s').textContent='Archivo verificado. Descarga iniciada.';document.getElementById('h').textContent='SHA-256: '+got;setTimeout(()=>b.click(),150);}catch(e){document.getElementById('s').textContent='ENTREGA BLOQUEADA';document.getElementById('h').textContent=String(e);}}build();
